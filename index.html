<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 19c-6 0-10-4-10-11 6 0 10 4 10 11Z%22 fill=%22%233C8C5C%22/%3E%3Cpath d=%22M16 15c5 0 9-3 9-9-5 0-9 3-9 9Z%22 fill=%22%23E3862A%22/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Torella Soins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: jardin de simples — rail en dégradé feuillage, plan de travail clair parsemé de taches végétales, une couleur par famille de soins (phyto sauge, aroma lavande, gemmo églantine, oligo ciel, Bach calendula) */
:root{
  --bg:#F3F8F1; --surface:#FFFFFF; --sunk:#EEF4EC; --line:#DDE8DA; --ink:#1D2B23; --ink-2:#4A5D52; --ink-3:#7E9086;
  --leaf:#3C8C5C; --leaf-soft:#DDF1E3; --leaf-ink:#215A3A;
  --saffron:#E3862A; --saffron-soft:#FDEBD5;
  --lav:#8A6CCB; --lav-soft:#EEE8FA;
  --rose:#D45379; --rose-soft:#FCE4EB;
  --sky:#3B8DB8; --sky-soft:#DDF0F8;
  --sun:#D9A514; --sun-soft:#FBF2CF;
  --ok:#2F8A55; --warn:#C27409; --bad:#C2413A; --warn-soft:#FCEBD2; --bad-soft:#FBE0DD;
  --rail-a:#2E6B4A; --rail-b:#3A8B78; --rail-c:#6B7FC0; --rail-ink:#FFFFFF;
  --blob-1:rgba(138,108,203,.13); --blob-2:rgba(227,134,42,.11); --blob-3:rgba(60,140,92,.12);
  --f-display:"Young Serif", "Georgia", serif; --f-body:"Nunito", system-ui, sans-serif; --f-mono:"IBM Plex Mono", ui-monospace, monospace;
  --r:14px; --shadow:0 1px 2px rgba(29,43,35,.05), 0 10px 30px -14px rgba(46,107,74,.28);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1713; --surface:#16211B; --sunk:#1C2A22; --line:#28382F; --ink:#E8F0EA; --ink-2:#AFC1B6; --ink-3:#7D9187;
  --leaf:#72C895; --leaf-soft:#1C3527; --leaf-ink:#A8E3C0; --saffron:#F2A75A; --saffron-soft:#3A2814;
  --lav:#B9A2F0; --lav-soft:#2A2340; --rose:#F08AA8; --rose-soft:#3D1F2A; --sky:#7CC0E4; --sky-soft:#172F3C; --sun:#EFCB5C; --sun-soft:#352C10;
  --ok:#72C895; --warn:#F0B055; --bad:#EE8379; --warn-soft:#3A2A12; --bad-soft:#3D1F1C;
  --rail-a:#173C2A; --rail-b:#1C4A44; --rail-c:#2F3A66; --rail-ink:#F2F7F3;
  --blob-1:rgba(185,162,240,.08); --blob-2:rgba(242,167,90,.06); --blob-3:rgba(114,200,149,.07);
  --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#16211B; --sunk:#1C2A22; --line:#28382F; --ink:#E8F0EA; --ink-2:#AFC1B6; --ink-3:#7D9187;
  --leaf:#72C895; --leaf-soft:#1C3527; --leaf-ink:#A8E3C0; --saffron:#F2A75A; --saffron-soft:#3A2814;
  --lav:#B9A2F0; --lav-soft:#2A2340; --rose:#F08AA8; --rose-soft:#3D1F2A; --sky:#7CC0E4; --sky-soft:#172F3C; --sun:#EFCB5C; --sun-soft:#352C10;
  --ok:#72C895; --warn:#F0B055; --bad:#EE8379; --warn-soft:#3A2A12; --bad-soft:#3D1F1C;
  --rail-a:#173C2A; --rail-b:#1C4A44; --rail-c:#2F3A66; --rail-ink:#F2F7F3;
  --blob-1:rgba(185,162,240,.08); --blob-2:rgba(242,167,90,.06); --blob-3:rgba(114,200,149,.07);
  --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}

/* familles de soins */
.c-phyto{--c:var(--leaf);--c-soft:var(--leaf-soft)} .c-aroma{--c:var(--lav);--c-soft:var(--lav-soft)} .c-gemmo{--c:var(--rose);--c-soft:var(--rose-soft)} .c-oligo{--c:var(--sky);--c-soft:var(--sky-soft)} .c-bach{--c:var(--saffron);--c-soft:var(--saffron-soft)} .c-autre{--c:var(--sun);--c-soft:var(--sun-soft)}
.t1{--c:var(--leaf);--c-soft:var(--leaf-soft)} .t2{--c:var(--lav);--c-soft:var(--lav-soft)} .t3{--c:var(--saffron);--c-soft:var(--saffron-soft)} .t4{--c:var(--rose);--c-soft:var(--rose-soft)} .t5{--c:var(--sky);--c-soft:var(--sky-soft)}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(40rem 30rem at 95% -5%,var(--blob-1),transparent 70%),radial-gradient(34rem 26rem at 40% 105%,var(--blob-2),transparent 70%),radial-gradient(30rem 24rem at 10% 30%,var(--blob-3),transparent 70%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:244px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:26px;color:var(--rail-ink);background:linear-gradient(170deg,var(--rail-a),var(--rail-b) 55%,var(--rail-c));overflow:hidden}
.rail::after{content:"";position:absolute;right:-60px;bottom:-40px;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%);pointer-events:none}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:27px;letter-spacing:.2px;line-height:1}
.brand small{display:block;font-size:11.5px;opacity:.8;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px;position:relative;z-index:1}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:12px;color:inherit;opacity:.82;font-weight:600;text-align:left}
.nav button:hover{background:rgba(255,255,255,.1);opacity:1}
.nav button[aria-current="page"]{background:rgba(255,255,255,.2);opacity:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.nav svg{width:20px;height:20px;flex:none}
.rail .foot{margin-top:auto;font-size:12px;padding:0 8px;display:flex;flex-direction:column;gap:8px;opacity:.9;position:relative;z-index:1}
.ctx{border-radius:12px;padding:10px 12px;font-size:13.5px;background:rgba(255,255,255,.14);font-weight:600}
.ctx span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;opacity:.75;font-weight:700}
main{min-width:0;padding-block:30px 60px;padding-left:max(30px, env(safe-area-inset-left,0px));padding-right:max(30px, env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--leaf);font-weight:800}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.2vw,44px);line-height:1.08;margin:4px 0 0;text-wrap:balance}
h2{font-size:15.5px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:8px;height:8px;border-radius:50% 0 50% 0;background:var(--c,var(--leaf));flex:none}
h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1.15}
.muted{color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.latin{font-style:italic;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .15s,box-shadow .15s}
.btn:hover{border-color:var(--leaf);box-shadow:var(--shadow)}
.btn.primary{background:linear-gradient(135deg,var(--leaf),var(--rail-b));border-color:transparent;color:#fff}
.btn.primary:hover{transform:translateY(-1px)}
.btn.primary:disabled{background:var(--leaf-soft);color:var(--leaf-ink);transform:none;box-shadow:none;cursor:default}
.btn.ghost{border-color:transparent;background:none;box-shadow:none}
.btn svg{width:16px;height:16px}
.btn.sm{padding:6px 12px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px;min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:20px}
.g-dash{grid-template-columns:1.35fr 1fr}
.g-2{grid-template-columns:1fr 1fr}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;background:var(--c-soft,var(--sunk));font-size:12.5px;color:var(--c,var(--ink-2));font-weight:700;white-space:nowrap}
.chip.leaf{background:var(--leaf-soft);color:var(--leaf-ink)}
.chip.saf{background:var(--saffron-soft);color:var(--saffron)}
.chip.lav{background:var(--lav-soft);color:var(--lav)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 13px}
.input:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-soft)}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.search .input{padding-left:38px;border-radius:999px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;align-self:flex-start;max-width:100%}
.tabs button{border:0;background:none;padding:8px 15px;font-weight:700;color:var(--ink-3);border-radius:999px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:#fff;background:var(--leaf)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--leaf-ink);box-shadow:var(--shadow)}

/* Accueil */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:28px 30px;color:#fff;background:linear-gradient(120deg,var(--rail-a),var(--rail-b) 50%,var(--rail-c));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;min-height:170px}
.hero h1{color:#fff;max-width:18ch}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.hero .btn{position:relative;z-index:1;background:#fff;color:var(--rail-a);border-color:transparent}
.hero svg.deco{position:absolute;right:-10px;top:-14px;width:300px;height:220px;opacity:.95;pointer-events:none}
.hero > div{position:relative;z-index:1}
.today{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--c-soft);}
.slot .t{font-family:var(--f-mono);font-size:14px;color:var(--c);font-weight:500}
.slot .t small{display:block;color:var(--ink-3);font-size:11.5px}
.slot.now{box-shadow:inset 0 0 0 2px var(--c)}
.slot b{font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpi{padding:16px 18px;border-radius:18px;background:var(--c-soft);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50% 0 50% 0;background:var(--c);opacity:.18;transform:rotate(20deg)}
.kpi .v{font-family:var(--f-display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--c)}
.kpi .l{font-size:13px;color:var(--ink-2);font-weight:600}
.list-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.list-row:first-child{border-top:0}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--c-soft,var(--leaf-soft));color:var(--c,var(--leaf-ink));flex:none}

/* Patients */
.ptable{width:100%;border-collapse:collapse}
.ptable th{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);text-align:left;font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line)}
.ptable td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable tr:last-child td{border-bottom:0}
.ptable tr.click{cursor:pointer}
.ptable tr.click:hover td{background:var(--sunk)}
.who{display:flex;gap:12px;align-items:center}
.who b{display:block;font-weight:800}
.who small{color:var(--ink-3)}
.p-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.p-head .avatar{width:60px;height:60px;font-size:19px}
.back{border:0;background:none;color:var(--leaf);display:inline-flex;gap:6px;align-items:center;padding:0;font-weight:800;font-size:13px;align-self:flex-start}
.back svg{width:15px;height:15px}
.meters{display:grid;gap:16px}
.meter .row{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.meter .bar{height:9px;background:var(--sunk);border-radius:6px;margin-top:6px;position:relative;overflow:hidden}
.meter .bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--leaf),var(--rail-b));border-radius:6px}
.meter .bar i.w{background:linear-gradient(90deg,var(--sun),var(--saffron))}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:14.5px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.rx{border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.rx-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 20px;border-top:1px dashed var(--line);border-left:4px solid var(--c,var(--leaf))}
.rx-item:first-of-type{border-top:0}
.rx-head{padding:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(120deg,var(--leaf-soft),var(--lav-soft))}
.icon-btn{border:0;background:none;color:var(--ink-3);padding:6px;border-radius:8px}
.icon-btn:hover{background:var(--bad-soft);color:var(--bad)}
.icon-btn svg{width:16px;height:16px;display:block}

/* Répertorisation */
.rep{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
.symgroup{border-top:1px solid var(--line);padding:10px 0}
.symgroup:first-child{border-top:0;padding-top:0}
.symgroup h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--c,var(--ink-3));font-weight:800}
.sym{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:10px;cursor:pointer;font-size:14px}
.sym:hover{background:var(--sunk)}
.sym:has(input:checked){background:var(--leaf-soft);color:var(--leaf-ink);font-weight:700}
.sym input{accent-color:var(--leaf);width:16px;height:16px;margin:0}
.scroll-x{overflow-x:auto;min-width:0}
.rgrid{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
.rgrid th,.rgrid td{padding:0;border-bottom:1px solid var(--line)}
.rgrid thead th{vertical-align:bottom;height:150px;position:relative;width:34px;min-width:34px}
.rgrid thead th > div{position:absolute;bottom:10px;left:50%;transform-origin:left bottom;transform:translateX(4px) rotate(-60deg);white-space:nowrap;font-weight:600;font-size:12px;color:var(--ink-2)}
.rgrid thead th.rem{width:auto;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);padding:0 10px 10px 0}
.rgrid thead th.sc{width:120px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);padding:0 0 10px 10px}
.rgrid td.rem{padding:10px 12px 10px 0;min-width:190px}
.rgrid td.rem b{font-weight:800;display:block}
.rgrid td.rem small{font-size:12px}
.rgrid td.dot{text-align:center}
.d{display:inline-block;border-radius:50%;background:var(--c,var(--leaf))}
.d1{width:7px;height:7px;opacity:.45}.d2{width:11px;height:11px;opacity:.75}.d3{width:15px;height:15px}
.rgrid td.sc{padding:10px 0 10px 10px}
.score{display:flex;align-items:center;gap:8px}
.score .bar{flex:1;height:8px;border-radius:6px;background:var(--sunk);overflow:hidden;min-width:50px}
.score .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--saffron))}
.rgrid tr.rrow{cursor:pointer}
.rgrid tr.rrow:hover td{background:var(--sunk)}
.empty{padding:36px 18px;text-align:center;color:var(--ink-3)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* Remèdes */
.mm{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:20px;align-items:start}
.mlist{display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow:auto}
.mitem{display:flex;gap:12px;align-items:center;padding:9px 12px;border:0;background:none;text-align:left;border-radius:14px;width:100%}
.mitem:hover{background:var(--sunk)}
.mitem[aria-current="true"]{background:var(--c-soft)}
.mitem b{display:block;font-weight:800;font-size:14.5px}
.mitem small{font-size:12.5px}
.glyph{width:36px;height:36px;border-radius:50% 12px 50% 12px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:500;flex:none;background:var(--c-soft);color:var(--c)}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.plate-top{display:grid;grid-template-columns:150px 1fr;gap:22px;padding:26px;align-items:center;background:radial-gradient(22rem 14rem at 0% 0%,var(--c-soft),transparent 75%),linear-gradient(180deg,var(--c-soft),var(--surface))}
.plate-top canvas{width:150px;height:150px;max-width:100%;background:var(--surface);border-radius:50%;box-shadow:inset 0 0 0 6px var(--c-soft)}
.plate-top .eyebrow{color:var(--c)}
.plate-name{font-family:var(--f-display);font-size:clamp(28px,3.5vw,40px);line-height:1.05;margin:4px 0}
.plate-body{padding:22px 26px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.sec h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--c,var(--ink-3));font-weight:800}
.sec p{margin:0;max-width:62ch}
.caution{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 12px 12px 0;font-size:14px}

/* Terrain */
.qrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.diath{display:flex;flex-direction:column;gap:14px}
.dbar .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;align-items:baseline}
.dbar .bar{height:12px;background:var(--sunk);border-radius:8px;margin-top:6px;overflow:hidden}
.dbar .bar i{display:block;height:100%;background:var(--c,var(--ink-3));opacity:.55;border-radius:8px;transition:width .35s ease}
.dbar.top .bar i{opacity:1}

/* Agenda */
.week{display:grid;grid-template-columns:52px repeat(6,minmax(120px,1fr));min-width:780px}
.week .hcell{padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}
.week .hcell b{font-family:var(--f-display);font-weight:400;font-size:24px;display:block;line-height:1}
.week .hcell.today b{color:var(--leaf)}
.week .hours div{height:52px;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);text-align:right;padding-right:8px;transform:translateY(-7px)}
.week .col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 52px}
.week .col.today{background-color:color-mix(in srgb,var(--leaf-soft) 55%,transparent)}
.appt{position:absolute;left:4px;right:4px;border-radius:12px;padding:6px 9px;font-size:12.5px;line-height:1.3;background:var(--leaf-soft);border:0;border-left:4px solid var(--leaf);overflow:hidden;cursor:pointer;text-align:left;color:var(--ink)}
.appt.bilan{background:var(--saffron-soft);border-left-color:var(--saffron)}
.appt b{display:block;font-weight:800}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--rose);z-index:2}
.nowline::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--rose)}

/* Gestion */
.inv-status{font-size:12px}
.tot{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;gap:12px}
.tot.big{font-family:var(--f-display);font-size:24px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.invoice-sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.invoice-sheet::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--leaf),var(--lav),var(--saffron))}
.invoice-sheet table{width:100%;border-collapse:collapse;font-size:14px;margin-top:14px}
.invoice-sheet th{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:800}
.invoice-sheet td{padding:10px 8px;border-bottom:1px solid var(--line)}
.qrbill{display:grid;grid-template-columns:auto 1fr;gap:20px;margin-top:20px;padding-top:18px;border-top:1px dashed var(--ink-3)}
.qr-l{display:flex;flex-direction:column;gap:8px}
.qr-l svg{border-radius:8px}
.qr-r{display:grid;gap:2px;margin:0;font-size:13.5px;align-content:start}
.qr-r dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:800;margin-top:8px}
.qr-r dt:first-child{margin-top:0}
.qr-r dd{margin:0}
@media (max-width:520px){.qrbill{grid-template-columns:1fr}}
.t590{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;margin:16px 0 0;padding:12px 14px;background:var(--leaf-soft);border-radius:14px;font-size:13.5px}
.t590 dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--leaf-ink);font-weight:800;opacity:.8}
.t590 dd{margin:0;overflow-wrap:anywhere;font-weight:600}
@media (max-width:520px){.t590{grid-template-columns:1fr 1fr}}
.pending{border-color:var(--saffron);background:linear-gradient(160deg,var(--saffron-soft),var(--surface) 70%)}
.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Modal + toast */
.scrim{position:fixed;inset:0;background:rgba(15,30,22,.45);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:24px;width:min(540px,100%);max-height:90vh;overflow:auto;padding:24px;box-shadow:var(--shadow)}
.form{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink-2)}
.form .full{grid-column:1/-1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--rail-a);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:60;box-shadow:var(--shadow)}
.note{font-size:12.5px;color:var(--ink-3)}
.auth{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:linear-gradient(150deg,var(--rail-a),var(--rail-b) 55%,var(--rail-c))}
.auth-card{width:min(420px,100%);background:var(--surface);border-radius:26px;padding:28px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px}
.auth-brand{padding:0;color:var(--ink)}
.auth-brand small{color:var(--ink-3);opacity:1}
.auth-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.auth-links button,.linkbtn{border:0;background:none;padding:0;color:var(--leaf);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.rail .linkbtn{color:inherit}
.sync{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;align-self:flex-start;background:rgba(255,255,255,.16)}
.sync.off{display:none}
.sync.err{background:var(--bad);color:#fff}
body.loading main{opacity:.4;pointer-events:none}
.modal.wide{width:min(680px,100%)}
.fsec{margin:6px 0 -2px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--leaf);font-weight:800}
.form-err{margin:0;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:13.5px;font-weight:600}
.ind-list{display:flex;flex-direction:column;gap:8px}
.ind-row{display:grid;grid-template-columns:1fr 120px auto;gap:8px;align-items:center}
.ind-new{display:flex;gap:8px;margin-top:8px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
@media (max-width:520px){.ind-row{grid-template-columns:1fr 96px auto}}

.tabbar{display:none}
@media (max-width:980px){
  .g-dash,.g-2,.rep,.mm{grid-template-columns:1fr}
  .mlist{max-height:none}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}

  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--leaf);background:var(--leaf-soft)}
  .mob-brand{display:flex}
  .hero{padding:22px 20px;min-height:0}
  .hero svg.deco{width:200px;height:150px;opacity:.6}
  .plate-top{grid-template-columns:96px 1fr;padding:18px;gap:14px}
  .plate-top canvas{width:96px;height:96px}
  .plate-body{grid-template-columns:1fr;padding:18px}
  .kpis{gap:8px}
  .kpi{padding:12px}
  .kpi .v{font-size:23px}
  .kpi .l{font-size:11.5px}
  .kv{grid-template-columns:1fr}

  .ptable .hide-m{display:none}
  .form{grid-template-columns:1fr}
  .tl{grid-template-columns:1fr;gap:4px}
  .panel{padding:16px}
}
.mob-brand{display:none;align-items:center;justify-content:space-between}
.mob-brand b{font-family:var(--f-display);font-weight:400;font-size:25px;color:var(--leaf-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function qrMatrix(text){
 if(typeof qrcode==='undefined')return null;
 qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
 const q=qrcode(0,'M');q.addData(text,'Byte');q.make();const n=q.getModuleCount();const m=[];for(let r=0;r<n;r++){m.push([]);for(let c=0;c<n;c++)m[r].push(q.isDark(r,c))}return m;
}

let SESSION=null,SYNCED={},SYNC_T=null,SYNC_STATE='ok',IS_ADMIN=false;
const KINDS=['patients','appts','invoices','depenses','remedies','customSym'];
const keyOf=(k,x)=>k==='invoices'?x.no:x.id;
function emptyDB(){const b=JSON.parse(JSON.stringify(SEED));return {patients:[],appts:[],invoices:[],depenses:[],remedies:JSON.parse(JSON.stringify(REMEDIES_BUILTIN)),customSym:[],cabinet:b.cabinet}}
function snapshot(){const m={};KINDS.forEach(k=>{m[k]={};(DB[k]||[]).forEach(x=>{const id=keyOf(k,x);if(id)m[k][id]=JSON.stringify(x)})});m.cabinet={main:JSON.stringify(DB.cabinet)};return m}
function setSync(st){SYNC_STATE=st;const el=document.getElementById('syncchip');if(el){el.textContent={ok:'Enregistré',busy:'Enregistrement…',err:'Non enregistré · nouvel essai',off:''}[st];el.className='sync '+st}}
function scheduleSync(){if(!CLOUD||!SESSION)return;setSync('busy');clearTimeout(SYNC_T);SYNC_T=setTimeout(pushSync,600)}
async function pushSync(){
 const now=snapshot();const ups=[],dels=[];
 for(const k of [...KINDS,'cabinet']){const a=now[k]||{},b=SYNCED[k]||{};
  for(const id in a)if(a[id]!==b[id])ups.push({kind:k,id,data:JSON.parse(a[id])});
  for(const id in b)if(!(id in a))dels.push([k,id]);}
 try{
  if(ups.length){const {error}=await sb.from('records').upsert(ups,{onConflict:'owner,kind,id'});if(error)throw error}
  for(const [k,id] of dels){const {error}=await sb.from('records').delete().eq('kind',k).eq('id',id);if(error)throw error}
  SYNCED=now;setSync('ok');
 }catch(e){console.error(e);setSync('err');clearTimeout(SYNC_T);SYNC_T=setTimeout(pushSync,8000)}
}
async function pullAll(){
 const rows=[];let from=0;
 for(;;){const {data,error}=await sb.from('records').select('kind,id,data').range(from,from+999);if(error)throw error;rows.push(...data);if(data.length<1000)break;from+=1000}
 if(!rows.length){DB=emptyDB();SYNCED={};await pushSync();return}
 const d=emptyDB();KINDS.forEach(k=>d[k]=[]);
 rows.forEach(r=>{if(r.kind==='cabinet')d.cabinet=r.data;else if(d[r.kind])d[r.kind].push(r.data)});
 if(!d.remedies.length)d.remedies=JSON.parse(JSON.stringify(REMEDIES_BUILTIN));
 d.invoices.sort((a,b)=>b.d.localeCompare(a.d)||b.no.localeCompare(a.no));
 DB=d;SYNCED=snapshot();
}

/* Montant en lettres, usage suisse romand (septante, huitante, nonante) */
function lettres(n){
 const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
 const D={2:'vingt',3:'trente',4:'quarante',5:'cinquante',6:'soixante',7:'septante',8:'huitante',9:'nonante'};
 const lt100=x=>{if(x<20)return U[x];const d=Math.floor(x/10),u=x%10;return D[d]+(u===0?'':u===1?' et un':'-'+U[u])};
 const lt1000=x=>{const c=Math.floor(x/100),r=x%100;let s='';if(c)s=(c>1?U[c]+' cent':'cent')+(c>1&&r===0?'s':'');if(r)s+=(s?' ':'')+lt100(r);return s||'zéro'};
 const w=x=>{if(x===0)return 'zéro';const m=Math.floor(x/1e6),k=Math.floor(x%1e6/1000),r=x%1000;let s='';if(m)s+=lt1000(m)+(m>1?' millions':' million');if(k)s+=(s?' ':'')+(k===1?'mille':lt1000(k).replace(/cents$/,'cent')+' mille');if(r)s+=(s?' ':'')+lt1000(r);return s};
 const a=Math.abs(n),f=Math.floor(a+1e-9),c=Math.round((a-f)*100);
 let s=w(f)+(f>1?' francs':' franc');if(c)s+=' et '+w(c)+(c>1?' centimes':' centime');return (n<0?'moins ':'')+s;
}

/* ---------- Répertoire ---------- */
function scoreAll(){
 const sel=[...S.sel];
 return REMEDIES.map(r=>{let s=0,c=0;sel.forEach(id=>{const w=r.sym[id]||0;s+=w;if(w)c++});return {r,s,c}}).filter(x=>x.c>0).sort((a,b)=>b.c-a.c||b.s-a.s).slice(0,12);
}

/* petite planche botanique générative, seedée par le nom */
function drawHerb(r){
 const c=$('#herb');if(!c)return;const x=c.getContext('2d');const cs=getComputedStyle(document.documentElement);
 const pl=getComputedStyle(document.querySelector('.plate')||document.documentElement);const leaf=(pl.getPropertyValue('--c')||cs.getPropertyValue('--leaf')).trim(),saf=cs.getPropertyValue(r.cat==='bach'?'--rose':'--saffron').trim(),ink=cs.getPropertyValue('--ink-3').trim();
 let seed=[...r.id].reduce((a,ch)=>a*31+ch.charCodeAt(0),7)>>>0;const rnd=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
 x.clearRect(0,0,300,300);x.lineCap='round';
 if(r.cat==='oligo'){x.strokeStyle=ink;x.lineWidth=1.5;const n=6;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;x.beginPath();x.arc(150+Math.cos(a)*70,150+Math.sin(a)*70,22,0,7);x.stroke()}x.fillStyle=saf;x.beginPath();x.arc(150,150,34,0,7);x.fill();x.fillStyle=getComputedStyle(document.body).backgroundColor;x.font='500 26px "IBM Plex Mono", monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(r.latin.split('-')[0],150,151);return}
 const stems=r.cat==='bach'?1:2+Math.floor(rnd()*2);
 for(let s=0;s<stems;s++){
  const bx=150+(s-(stems-1)/2)*34,top=50+rnd()*40,bend=(rnd()-.5)*60;
  x.strokeStyle=ink;x.lineWidth=2;x.beginPath();x.moveTo(bx,280);x.quadraticCurveTo(bx+bend,180,bx+bend*.6,top);x.stroke();
  const leaves=4+Math.floor(rnd()*4);
  for(let i=0;i<leaves;i++){const t=.25+i/leaves*.7;const py=280-(280-top)*t;const px=bx+bend*Math.sin(t*1.6)*.75;const dir=i%2?1:-1;const len=22+rnd()*26*(1-t*.4);const ang=dir*(.6+rnd()*.5);
   x.save();x.translate(px,py);x.rotate(ang-Math.PI/2*dir*.2);x.fillStyle=leaf;x.globalAlpha=.55+rnd()*.4;x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(dir*len*.5,-len*.45,dir*len,-len*.1);x.quadraticCurveTo(dir*len*.5,len*.25,0,0);x.fill();x.restore()}
  x.globalAlpha=1;
  const fx=bx+bend*.6,fy=top;
  if(r.cat==='gemmo'){x.fillStyle=saf;for(let k=0;k<3;k++){x.beginPath();x.ellipse(fx+(k-1)*7,fy+k*3,6,12,(k-1)*.4,0,7);x.fill()}}
  else{const petals=5+Math.floor(rnd()*3);for(let k=0;k<petals;k++){const a=k/petals*Math.PI*2;x.fillStyle=k%2?saf:leaf;x.globalAlpha=.85;x.beginPath();x.ellipse(fx+Math.cos(a)*10,fy+Math.sin(a)*10,9,5,a,0,7);x.fill()}x.globalAlpha=1;x.fillStyle=saf;x.beginPath();x.arc(fx,fy,5,0,7);x.fill()}
 }
 if(r.cat==='aroma'){x.fillStyle=saf;x.globalAlpha=.9;x.beginPath();x.moveTo(250,200);x.quadraticCurveTo(266,228,250,236);x.quadraticCurveTo(234,228,250,200);x.fill();x.globalAlpha=1}
}

  <section class="panel" style="position:sticky;top:20px"><div class="panel-h"><h2>Profil</h2><span class="note">${answered}/15 réponses</span></div>
   <div class="diath">${sc.map(({d,v},di)=>`<div class="dbar t${di+1} ${v===max&&v>0?'top':''}"><div class="row"><span><b style="font-weight:600">${d.id} · ${d.nom}</b></span><span class="mono">${v}/6</span></div><div class="bar"><i style="width:${v/6*100}%"></i></div>${v===max&&v>0?`<div class="muted" style="font-size:13px;margin-top:5px">Catalyseur : ${d.oligo}</div>`:''}</div>`).join('')}</div>
   ${max===0?'<p class="note" style="margin:16px 0 0">Répondez aux questions : la diathèse dominante apparaîtra ici.</p>':''}
  </section>
 </div>`;
}

/* ---------- Agenda ---------- */
const isoD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function weekStart(off){const d=new Date(TODAY);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd+off*7);return d}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-n+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7)}
function vAgenda(){
 const ws=weekStart(S.wk||0);const days=[];for(let i=0;i<6;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);days.push(d)}
 const H0=8,H1=19,PX=52;const now=new Date();const nm=(now.getHours()-H0)*60+now.getMinutes();
 const last=days[5];const lab=`${days[0].getDate()}${days[0].getMonth()!==last.getMonth()?' '+days[0].toLocaleDateString('fr-CH',{month:'long'}):''} – ${last.getDate()} ${last.toLocaleDateString('fr-CH',{month:'long',year:'numeric'})}`;
 return `<div class="head"><div><div class="eyebrow">Semaine ${isoWeek(ws)} · ${lab}</div><h1>Agenda</h1></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="seg" role="group" aria-label="Semaine"><button data-wk="-1" aria-label="Semaine précédente">‹</button><button data-wk="0" aria-pressed="${!S.wk}">Aujourd'hui</button><button data-wk="1" aria-label="Semaine suivante">›</button></div><button class="btn primary" data-act="newappt">${ic('plus')}Rendez-vous</button></div></div>
 <section class="panel" style="padding:0"><div class="scroll-x"><div class="week">

 if(!t)return;const d=t.dataset;
 if(d.close!==undefined){if(e.target===t||t.tagName==='BUTTON')closeModal();return}
 if(d.go)return go(d.go,d.go==='patients'?{pdetail:false}:{});
 if(d.appt)return apptForm(d.appt);
 if(d.wk!==undefined){S.wk=d.wk==='0'?0:(S.wk||0)+(+d.wk);return render()}
 if(d.open){closeModal();return go('patients',{pid:d.open,pdetail:true,ptab:'synthese'})}
 if(d.ptab){S.ptab=d.ptab;return render()}
 if(d.mid){S.mid=d.mid;render();if(innerWidth<980)document.querySelector('.plate')?.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(d.mcat){S.mcat=d.mcat;return render()}
 if(d.mono)return go('matiere',{mid:d.mono,mq:'',mcat:'all'});
 if(d.inv){S.inv=d.inv;render();if(innerWidth<980)document.querySelector('.invoice-sheet')?.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(d.gtab){S.gtab=d.gtab;return render()}
 if(d.dtype){S.dtype=d.dtype;return render()}
 if(d.per){S.per=d.per;return render()}
 if(d.gotodoc)return go('factures',{gtab:'docs',dtype:'all',inv:d.gotodoc});
 if(d.accept){DB.invoices.find(x=>x.no===d.accept).status='accepte';save();toast('Devis accepté');return render()}
 if(d.convert){const q=DB.invoices.find(x=>x.no===d.convert);const f={no:nextNo('facture'),type:'facture',p:q.p,d:TODAY_ISO,ref:q.no,lignes:JSON.parse(JSON.stringify(q.lignes)),status:'envoyee'};q.status='converti';DB.invoices.unshift(f);save();toast('Devis '+q.no+' converti en facture '+f.no);S.inv=f.no;S.dtype='all';return render()}
 if(d.avoir){const q=DB.invoices.find(x=>x.no===d.avoir);const f={no:nextNo('avoir'),type:'avoir',p:q.p,d:TODAY_ISO,ref:q.no,lignes:JSON.parse(JSON.stringify(q.lignes)),status:'ouvert'};DB.invoices.unshift(f);save();toast('Avoir '+f.no+' créé');S.inv=f.no;S.dtype='all';return render()}
 if(d.dup){const q=DB.invoices.find(x=>x.no===d.dup);const f={no:nextNo('devis'),type:'devis',p:q.p,d:TODAY_ISO,ref:q.no,lignes:JSON.parse(JSON.stringify(q.lignes)),status:'ouvert'};DB.invoices.unshift(f);save();toast('Devis '+f.no+' créé');S.inv=f.no;S.dtype='all';return render()}
 if(d.rmexp!==undefined){const x=DB.depenses.splice(+d.rmexp,1)[0];save();toast('Dépense supprimée : '+x.lib);return render()}
 if(d.addrx){const p=P(S.pid);if(p&&!p.programme.some(x=>x.r===d.addrx)){p.programme.push({r:d.addrx,note:''});save();toast(REM[d.addrx].nom+' ajouté au programme de '+p.prenom)}return render()}
 if(d.rmrx!==undefined){const p=P(S.pid);const r=p.programme.splice(+d.rmrx,1)[0];save();toast(REM[r.r].nom+' retiré');return render()}
 if(d.ans){S.ans[d.ans]=+d.v;return render()}
 if(d.act==='newpatient')return newPatient();
 if(d.act==='newappt')return apptForm(null);
 if(d.act==='logout')return logout();
 if(d.act==='examples')return loadExamples();
 if(d.act==='editpatient')return patientForm(P(S.pid));
 if(d.act==='newrem')return remedyForm(null);
 if(d.act==='editrem')return remedyForm(S.mid);
 if(d.act==='applytarif')return applyPending();
 if(d.act==='dismisstarif')return dismissPending();
 if(d.pdf)return downloadPdf(d.pdf);
 if(d.act==='newdoc')return newInvoice(d.t);
 if(d.act==='newexp')return newExpense();
 if(d.act==='pay')return payModal(d.no);
 if(d.act==='backlist')return go('patients',{pdetail:false});
 if(d.act==='reperto'){const p=P(S.pid);S.sel=new Set(p?p.sym:[]);return go('bilan')}
 if(d.act==='loadsym'){const p=P(S.pid);S.sel=new Set(p.sym);return render()}
 if(d.act==='clearsym'){S.sel=new Set();return render()}
 if(d.act==='resetq'){S.ans={};return render()}
 if(d.act==='saveterrain'){const sc=DIATH.map(x=>({id:x.id,v:x.q.reduce((a,_,i)=>a+(S.ans[x.id+i]||0),0)})).sort((a,b)=>b.v-a.v);const p=P(S.pid);p.terrain=sc[0].id;save();toast('Terrain enregistré pour '+p.prenom);return}
 if(d.act==='copyrx'){const p=P(S.pid);const txt=`Programme d'hygiène vitale — ${full(p)}\n\n`+p.programme.filter(x=>REM[x.r]).map(x=>{const r=REM[x.r];return `• ${r.nom} (${r.latin})\n  ${r.poso}${x.note?'\n  Note : '+x.note:''}\n  Précaution : ${r.prec}`}).join('\n\n');
  const ok=()=>toast('Programme copié');navigator.clipboard?.writeText(txt).then(ok).catch(()=>toast('Copie refusée par le navigateur'));return}
});
document.addEventListener('change',e=>{const s=e.target.dataset.sym;if(s){e.target.checked?S.sel.add(s):S.sel.delete(s);render();const el=document.getElementById('s-'+s);el&&el.focus()}});
document.addEventListener('input',e=>{
 if(e.target.id==='pq'||e.target.id==='mq'){const id=e.target.id,pos=e.target.selectionStart;S[id]=e.target.value;render();const el=document.getElementById(id);el.focus();el.setSelectionRange(pos,pos)}
});
document.addEventListener('submit',e=>{if(e.target.id!=='fcab')return;e.preventDefault();const g=k=>document.getElementById('cab-'+k).value.trim();
 const iban=g('iban').replace(/\s/g,'').toUpperCase();
 Object.assign(DB.cabinet,{nom:g('nom'),therapeute:g('therapeute'),rue:g('rue'),no:g('no'),npa:g('npa'),ville:g('ville'),rcc:g('rcc').toUpperCase(),registre:g('registre'),iban,rate:+g('rate')||10});save();toast(ibanOk(iban)?'Identité de facturation enregistrée':'Enregistré, mais l\'IBAN est invalide');render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>render());
new MutationObserver(()=>{if(S.view==='matiere')drawHerb(REM[S.mid])}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
boot();
</script>

</body>
</html>
